[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agency"
version = "0.1.0"
description = "Byzantine-robust, injection-hardened multi-agent LLM defense pipelines (reference implementation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aegis-Agency authors" }]
keywords = ["llm-security", "byzantine-robust", "prompt-injection", "multi-agent", "jailbreak-defense"]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "pandas>=2.0",
]
# Judge backends (EC2). installed separately; the package core stays dependency-light.
llm = [
    "openai>=1.30",
    "anthropic>=0.30",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]
# Full EC2 stack: LLM backends plus vLLM for self-hosted open models.
ec2 = [
    "openai>=1.30",
    "anthropic>=0.30",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "vllm>=0.5; sys_platform == 'linux'",
]

[project.scripts]
aegis-agency = "aegis_agency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
